<div class="login-container">
  <div class="login-card">

    <h2 class="login-title">Bienvenue</h2>
    <p class="login-subtitle">Connectez-vous pour continuer</p>

    <form (ngSubmit)="login()">

      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        Se connecter
      </button>

    </form>
  </div>
</div>
