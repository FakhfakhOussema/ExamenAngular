<button mat-raised-button
        color="primary"
        routerLink="/subcategories/add"
        style="float:right;">
  Add SubCategory
</button>

<table mat-table [dataSource]="dataSource"
class="mat-elevation-z8"
style="width:80%; margin:auto;">

<!-- ID -->
<ng-container matColumnDef="productSubcategoryID">
<th mat-header-cell *matHeaderCellDef>ID</th>
<td mat-cell *matCellDef="let element">
{{element.productSubcategoryID}}
</td>
</ng-container>

<!-- Name -->
<ng-container matColumnDef="name">
<th mat-header-cell *matHeaderCellDef>Name</th>
<td mat-cell *matCellDef="let element">
{{element.name}}
</td>
</ng-container>

<!-- Category ID -->
<ng-container matColumnDef="productCategoryID">
<th mat-header-cell *matHeaderCellDef>Category ID</th>
<td mat-cell *matCellDef="let element">
{{element.productCategoryID}}
</td>
</ng-container>

<!-- Actions -->
<ng-container matColumnDef="actions">
<th mat-header-cell *matHeaderCellDef>Actions</th>

<td mat-cell *matCellDef="let element">

<button mat-icon-button color="accent"
  (click)="openEditSubCategory(element)">
  <mat-icon>edit</mat-icon>
</button>

<button mat-icon-button color="warn"
(click)="deleteSubCategory(element.productSubcategoryID)">
<mat-icon>delete</mat-icon>
</button>

</td>
</ng-container>

<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
