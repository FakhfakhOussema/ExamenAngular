<h2 style="text-align:center;">
  {{ isEditMode ? 'Edit Product' : 'Add Product' }}
</h2>

<form [formGroup]="form" (ngSubmit)="save()" style="width:60%; margin:auto;">

  <mat-form-field style="width:100%">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>Product Number</mat-label>
    <input matInput formControlName="productNumber">
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>Standard Cost</mat-label>
    <input matInput type="number" formControlName="standardCost">
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>List Price</mat-label>
    <input matInput type="number" formControlName="listPrice">
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>Safety Stock Level</mat-label>
    <input matInput type="number" formControlName="safetyStockLevel" min="1">
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>Start Date</mat-label>
    <input matInput type="date" formControlName="sellStartDate">
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>Category</mat-label>
    <mat-select formControlName="categoryID">
      <mat-option *ngFor="let cat of categories" [value]="cat.categoryID">
        {{ cat.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field style="width:100%">
    <mat-label>Sub Category</mat-label>
    <mat-select formControlName="productSubcategoryID" [disabled]="!form.get('categoryID')?.value">
      <mat-option [value]="null">None</mat-option>
      <mat-option *ngFor="let sub of filteredSubCategories" [value]="sub.productSubcategoryID">
        {{ sub.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div style="margin-top:20px; display:flex; gap:10px;">
    <button mat-raised-button color="primary" type="submit">Save</button>
    <button mat-button routerLink="/products">Cancel</button>
  </div>

</form>
