<div class="login-container">
  <div class="login-card">

    <h2 class="login-title">Create Account</h2>
    <p class="login-subtitle">Sign up to get started</p>

    <form (ngSubmit)="signup()">

      <!-- Username -->
      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Username</mat-label>
        <input
          id="signup-username"
          matInput
          type="text"
          name="username"
          [(ngModel)]="username"
          required
        />
      </mat-form-field>

      <!-- Email -->
      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Email</mat-label>
        <input
          id="signup-email"
          matInput
          type="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Password</mat-label>
        <input
          id="signup-password"
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </mat-form-field>

      <!-- Confirm Password -->
      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Confirm Password</mat-label>
        <input
          id="signup-confirm-password"
          matInput
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
        />
      </mat-form-field>

      <!-- Submit Button -->
      <button
        id="signup-submit"
        mat-raised-button
        color="primary"
        type="submit"
        style="width:100%; margin-top:15px"
      >
        Create account
      </button>

      <!-- Login Redirect -->
      <button
        id="go-login"
        mat-button
        type="button"
        (click)="goToLogin()"
        style="margin-top:10px;width:100%"
      >
        Already have an account? Sign in
      </button>

    </form>
  </div>
</div>
