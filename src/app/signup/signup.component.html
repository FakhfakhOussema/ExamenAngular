<div class="login-container">
  <div class="login-card">

    <h2 class="login-title">Create Account</h2>
    <p class="login-subtitle">Sign up to get started</p>

    <form (ngSubmit)="signup()">

      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        Create account
      </button>

      <button mat-button type="button" (click)="goToLogin()" style="margin-top:10px;width:100%">
        Already have an account? Sign in
      </button>

    </form>
  </div>
</div>
